[project]
name = "docat"
version = "0.1.0"
description = "Simple read-only CLI wrapper for the Docker Engine socket (Unix & TCP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
docat = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]
